<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prototype A · 数据监控大屏风</title>
<style>
*{box-sizing:border-box}body{margin:0;min-width:1280px;background:#020815;color:#dff7ff;font-family:"Microsoft YaHei",Arial,sans-serif;overflow:hidden}.screen{height:100vh;padding:22px 28px;background:radial-gradient(circle at 50% 20%,rgba(0,180,255,.18),transparent 36%),linear-gradient(180deg,#061426,#020815)}.screen:before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(0,220,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,220,255,.07) 1px,transparent 1px);background-size:36px 36px;mask-image:radial-gradient(circle,#000 35%,transparent 80%);pointer-events:none}.hud{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:74px 1fr 110px;gap:16px}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border:1px solid rgba(0,224,255,.22);background:linear-gradient(90deg,rgba(0,224,255,.05),rgba(0,60,120,.18),rgba(0,224,255,.05));box-shadow:0 0 30px rgba(0,150,255,.16)}.brand{padding-left:24px;font-size:18px;letter-spacing:4px;color:#9eeeff}.title{text-align:center}.title h1{margin:0;font-size:28px;letter-spacing:8px;text-shadow:0 0 18px rgba(0,238,255,.65)}.title span{font-size:12px;letter-spacing:6px;color:#e9ca78}.clock{text-align:right;padding-right:24px;color:#72a9bd;font-family:Consolas,monospace}.main{display:grid;grid-template-columns:270px 1fr 300px;gap:16px;min-height:0}.panel{border:1px solid rgba(0,224,255,.22);background:linear-gradient(180deg,rgba(4,25,45,.78),rgba(2,10,24,.58));box-shadow:inset 0 0 26px rgba(0,188,255,.06),0 0 28px rgba(0,0,0,.28);position:relative;overflow:hidden}.panel h2{margin:0;padding:14px 16px;font-size:15px;letter-spacing:2px;border-bottom:1px solid rgba(0,224,255,.15);color:#e9ca78}.metric{display:flex;justify-content:space-between;margin:14px 16px;padding-bottom:12px;border-bottom:1px solid rgba(120,230,255,.08)}.metric b{font-size:26px;font-family:Consolas,monospace}.metric span{color:#7fb1c6;font-size:12px}.console{padding:16px}.console textarea{width:100%;height:112px;resize:none;border:1px solid rgba(0,224,255,.22);background:#06101f;color:#dff7ff;padding:12px;outline:none}.btn{width:100%;margin-top:12px;padding:13px;border:0;background:linear-gradient(90deg,#00d8ff,#e8c86f);color:#04101d;font-weight:800;letter-spacing:2px}.topology{position:relative;height:100%;min-height:570px}.node{position:absolute;width:150px;min-height:72px;border:1px solid rgba(0,224,255,.38);background:rgba(4,20,40,.76);box-shadow:0 0 22px rgba(0,190,255,.18);border-radius:10px;padding:12px;text-align:center;transition:.3s}.node b{display:block;font-size:15px}.node span{font-size:12px;color:#8bb9c9}.node.president{left:50%;top:20px;transform:translateX(-50%);border-color:#e8c86f;box-shadow:0 0 28px rgba(232,200,111,.28)}.node.ceo{left:50%;top:135px;transform:translateX(-50%)}.node.dept{width:136px}.n0{left:7%;top:285px}.n1{left:19%;top:405px}.n2{left:31%;top:285px}.n3{left:43%;top:405px}.n4{left:55%;top:285px}.n5{left:67%;top:405px}.n6{left:79%;top:285px}.n7{left:14%;top:535px}.n8{left:74%;top:535px}.node.idle{filter:grayscale(.5);opacity:.78}.node.running{border-color:#00e7ff;animation:pulse 1s infinite alternate}.node.done{border-color:#4dff9a;box-shadow:0 0 24px rgba(77,255,154,.25)}.node.error{border-color:#ff4568;animation:alarm .5s infinite alternate}.line{position:absolute;height:2px;background:linear-gradient(90deg,transparent,#00e8ff,transparent);transform-origin:left center;opacity:.6;overflow:hidden}.line:after{content:"";position:absolute;top:-2px;left:-20px;width:22px;height:6px;border-radius:8px;background:#e8c86f;box-shadow:0 0 12px #e8c86f;animation:flow 1.8s linear infinite}.l1{left:50%;top:102px;width:112px;transform:rotate(90deg)}.l2{left:50%;top:218px;width:280px;transform:rotate(118deg)}.l3{left:50%;top:218px;width:270px;transform:rotate(62deg)}.l4{left:50%;top:218px;width:250px;transform:rotate(90deg)}.l5{left:18%;top:368px;width:660px}.feed{height:calc(100% - 48px);padding:12px 16px;overflow:hidden;font-family:Consolas,"Microsoft YaHei";font-size:12px;color:#86dff0}.feed p{margin:0 0 10px}.bottom{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:16px}.summary{padding:14px 16px;color:#8fb8c7}.summary.show{color:#dff7ff}.bar{height:7px;margin:12px 0;background:#071427;border:1px solid rgba(0,224,255,.12)}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00e8ff,#e8c86f);transition:width .5s}@keyframes pulse{to{box-shadow:0 0 32px rgba(0,232,255,.55);transform:translateY(-4px)}}@keyframes alarm{to{box-shadow:0 0 28px rgba(255,69,104,.5)}}@keyframes flow{to{left:100%}}
</style>
</head>
<body>
<div class="screen"><div class="hud">
<header class="top"><div class="brand">SOURCEFLOW COMMAND</div><div class="title"><h1>源流决策台</h1><span>数据监控大屏风</span></div><div class="clock" id="clock"></div></header>
<main class="main">
<aside class="panel"><h2>任务控制台</h2><div class="console"><textarea id="q">评估多AI协同决策工作台的最小验证路径。</textarea><button class="btn" id="start">开始分析</button></div><div class="metric"><span>组织节点</span><b>11</b></div><div class="metric"><span>并行部门</span><b>9</b></div><div class="metric"><span>当前阶段</span><b id="stage">待命</b></div></aside>
<section class="panel topology" id="topology"><div class="line l1"></div><div class="line l2"></div><div class="line l3"></div><div class="line l4"></div><div class="line l5"></div></section>
<aside class="panel"><h2>数据流日志</h2><div class="feed" id="feed"><p>[00:00:00] 系统待命，等待总裁下达任务。</p></div></aside>
</main>
<footer class="bottom">
<section class="panel"><h2>拆解进度</h2><div class="summary">需求识别<div class="bar"><i id="p1"></i></div>角色分发<div class="bar"><i id="p2"></i></div></div></section>
<section class="panel"><h2>执行总裁汇总</h2><div class="summary" id="summary">分析完成后生成跨部门简报。</div></section>
<section class="panel"><h2>告警通道</h2><div class="summary" id="alerts">暂无异常。</div></section>
</footer>
</div></div>
<script>
const roles=["总裁","执行总裁","战略部","市场部","产品部","技术部","财务部","风险部","运营部","法务部","自定义部"];
const pos=["president","ceo","dept n0","dept n1","dept n2","dept n3","dept n4","dept n5","dept n6","dept n7","dept n8"];
const topo=document.getElementById("topology");roles.forEach((r,i)=>{const d=document.createElement("div");d.className="node idle "+pos[i];d.dataset.i=i;d.innerHTML=`<b>${r}</b><span>${i<2?"指挥层":"并行分析节点"}</span>`;topo.appendChild(d)});
function log(t){feed.innerHTML=`<p>[${new Date().toLocaleTimeString()}] ${t}</p>`+feed.innerHTML}
function setNodes(cls){document.querySelectorAll(".node").forEach(n=>{n.classList.remove("idle","running","done","error");n.classList.add(cls)})}
start.onclick=()=>{setNodes("idle");summary.textContent="执行中：等待各部门回传。";summary.classList.remove("show");stage.textContent="拆解";p1.style.width="0";p2.style.width="0";log("总裁任务已接收，执行总裁开始拆解。");document.querySelector('[data-i="1"]').className="node running ceo";setTimeout(()=>{p1.style.width="100%";stage.textContent="分发";log("任务拆解完成，9 个部门进入并行执行。");document.querySelector('[data-i="1"]').className="node done ceo";for(let i=2;i<11;i++){setTimeout(()=>{document.querySelector(`[data-i="${i}"]`).className="node running "+pos[i];log(roles[i]+" 正在回传分析数据。");setTimeout(()=>{document.querySelector(`[data-i="${i}"]`).className="node done "+pos[i];log(roles[i]+" 已完成。");if(i===10){p2.style.width="100%";stage.textContent="汇总";summary.textContent="汇总结论：建议以自用验证优先，重点监控 API Key 门槛、连续使用频率、单次决策耗时和最终输出质量。";summary.classList.add("show");alerts.textContent="风险提示：若 30 天内无法形成高频使用，应停止商业化投入。";stage.textContent="完成"}},900)},(i-2)*360)}},1600)}
setInterval(()=>clock.textContent=new Date().toLocaleString(),1000);
</script>
</body>
</html>
