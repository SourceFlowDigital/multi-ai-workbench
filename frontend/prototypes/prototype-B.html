<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prototype B · 极简玻璃态风</title>
<style>
:root{--bg:#060e1c;--panel:rgba(255,255,255,.055);--line:rgba(220,230,245,.13);--gold:#C9A84C;--gold2:#E8D29A;--blue:#3d86d8;--text:#edf4ff;--muted:#8fa0b8}*{box-sizing:border-box}body{margin:0;min-width:1280px;background:radial-gradient(800px 520px at 80% 0,rgba(61,134,216,.18),transparent),radial-gradient(700px 520px at 12% 95%,rgba(201,168,76,.09),transparent),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",sans-serif}.app{max-width:1440px;margin:auto;padding:34px 44px}.nav{height:68px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:2px}.brand small{display:block;color:var(--muted);font-weight:500;letter-spacing:3px;font-size:10px;margin-top:4px}.pill{border:1px solid var(--line);border-radius:999px;padding:10px 14px;color:var(--muted);background:rgba(255,255,255,.035)}.hero{display:grid;grid-template-columns:1fr 360px;gap:34px;align-items:end;margin:34px 0}.hero h1{font-size:54px;line-height:1.08;margin:0;letter-spacing:-1px}.hero p{max-width:680px;color:var(--muted);font-size:16px;line-height:1.8}.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));-webkit-background-clip:text;color:transparent}.card{border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.025));backdrop-filter:blur(24px);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.28)}.inputCard{padding:22px}.inputCard textarea{width:100%;height:118px;border:1px solid var(--line);border-radius:18px;background:rgba(4,10,20,.44);color:var(--text);resize:none;outline:none;padding:16px;font-size:15px}.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:800;color:#211801;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 12px 30px rgba(201,168,76,.22)}.inputActions{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:300px 1fr;gap:24px}.side{padding:22px}.side h2,.map h2,.summary h2{font-size:16px;margin:0 0 16px}.step{padding:15px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid transparent;margin-bottom:12px;color:var(--muted)}.step.active{border-color:rgba(201,168,76,.34);color:var(--text);box-shadow:0 0 0 4px rgba(201,168,76,.04)}.map{padding:26px;min-height:560px}.org{position:relative;height:480px}.node{position:absolute;width:168px;padding:16px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.06);backdrop-filter:blur(18px);transition:.35s}.node:hover{transform:translateY(-5px);border-color:rgba(201,168,76,.32)}.node b{display:block}.node span{font-size:12px;color:var(--muted)}.president{left:60px;top:20px}.ceo{left:285px;top:132px;border-color:rgba(201,168,76,.25)}.d0{left:35px;top:260px}.d1{left:230px;top:246px}.d2{left:425px;top:278px}.d3{left:620px;top:230px}.d4{left:815px;top:265px}.d5{left:120px;top:388px}.d6{left:325px;top:406px}.d7{left:540px;top:374px}.d8{left:760px;top:405px}.node:before{content:"";position:absolute;left:-34px;top:50%;width:28px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}.president:before{display:none}.idle{opacity:.64}.running{border-color:rgba(61,134,216,.65);box-shadow:0 0 34px rgba(61,134,216,.16);animation:breath 1.4s infinite alternate}.done{border-color:rgba(91,220,145,.42)}.summary{margin-top:24px;padding:22px;display:none}.summary.show{display:block;animation:rise .35s ease}.summary p{color:var(--muted);line-height:1.8}.status{float:right;font-size:12px;color:var(--muted)}@keyframes breath{to{box-shadow:0 0 40px rgba(61,134,216,.34)}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app">
<nav class="nav"><div class="brand">源流决策台<small>MINIMAL GLASS PROTOTYPE</small></div><div class="pill">本地模拟 · 无真实 API 调用</div></nav>
<section class="hero"><div><h1>让 AI 组织像<span class="gold">专业团队</span>一样安静运转</h1><p>这一版弱化大屏视觉，强调清晰、留白和高端工具感。用户只需要关注问题、角色状态和最终汇总。</p></div><section class="card inputCard"><textarea id="q">请评估多AI协同决策工作台是否值得继续做桌面端。</textarea><div class="inputActions"><span>Enter 可作为后续提交快捷键</span><button class="btn" id="start">开始分析</button></div></section></section>
<main class="layout">
<aside class="card side"><h2>分析流程</h2><div class="step" id="s1">1. 执行总裁拆解问题</div><div class="step" id="s2">2. 9 部门并行执行</div><div class="step" id="s3">3. 汇总为决策简报</div></aside>
<section><div class="card map"><h2>组织结构 <span class="status" id="status">空闲</span></h2><div class="org" id="org"></div></div><div class="card summary" id="summary"><h2>执行总裁汇总</h2><p>建议先以 2 周自用验证为唯一目标。若并行角色输出不能明显减少来回追问和多窗口切换，不进入商业化开发；若高频成立，再验证 API Key 配置门槛和 10 位种子用户付费意愿。</p></div></section>
</main>
</div>
<script>
const names=["总裁","执行总裁","战略部","市场部","产品部","技术部","财务部","风险部","运营部","法务部","自定义部"],cls=["president","ceo","d0","d1","d2","d3","d4","d5","d6","d7","d8"],org=document.getElementById("org");names.forEach((n,i)=>{let e=document.createElement("div");e.className="node idle "+cls[i];e.dataset.i=i;e.innerHTML=`<b>${n}</b><span>${i<2?"指挥层":"专业角色"}</span>`;org.appendChild(e)});
function phase(n){[s1,s2,s3].forEach(x=>x.classList.remove("active"));if(n)s[n]?.classList.add("active")}
const s=[null,s1,s2,s3];start.onclick=()=>{summary.classList.remove("show");document.querySelectorAll(".node").forEach(n=>{n.classList.remove("running","done");n.classList.add("idle")});status.textContent="拆解中";s1.classList.add("active");document.querySelector('[data-i="1"]').className="node running ceo";setTimeout(()=>{document.querySelector('[data-i="1"]').className="node done ceo";s1.classList.remove("active");s2.classList.add("active");status.textContent="并行执行";for(let i=2;i<11;i++){setTimeout(()=>{let n=document.querySelector(`[data-i="${i}"]`);n.className="node running "+cls[i];setTimeout(()=>{n.className="node done "+cls[i];if(i===10){s2.classList.remove("active");s3.classList.add("active");status.textContent="汇总完成";summary.classList.add("show")}},800)},(i-2)*260)}},1500)}
</script>
</body>
</html>
