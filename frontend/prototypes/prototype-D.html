<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prototype D · 年轻化拓扑玻璃风</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
:root{
  --bg-0:#0a0f2e;
  --bg-1:#111633;
  --bg-2:#1b1142;
  --indigo:#6366f1;
  --cyan:#06b6d4;
  --violet:#8b5cf6;
  --gold:#ffe08a;
  --gold-2:#fff2bd;
  --text:#f5f8ff;
  --muted:#aab6d3;
  --line:rgba(185,204,255,.18);
  --line-hot:rgba(6,182,212,.42);
  --success:#5af2a1;
  --danger:#ff5c8a;
  --glass:rgba(255,255,255,.105);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-width:1280px;
  height:100vh;
  overflow:hidden;
  color:var(--text);
  font-family:"Inter","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(900px 560px at 18% 18%,rgba(99,102,241,.34),transparent 58%),
    radial-gradient(820px 520px at 86% 20%,rgba(6,182,212,.24),transparent 58%),
    radial-gradient(860px 580px at 54% 100%,rgba(139,92,246,.24),transparent 62%),
    linear-gradient(135deg,#090d27 0%,#111633 42%,#241047 100%);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 22%,rgba(255,255,255,.10),transparent 1.5px),
    radial-gradient(circle at 82% 18%,rgba(255,255,255,.12),transparent 1.4px),
    radial-gradient(circle at 72% 78%,rgba(255,255,255,.09),transparent 1.6px),
    radial-gradient(circle at 34% 84%,rgba(255,255,255,.08),transparent 1.4px);
  opacity:.55;
}
.screen{
  position:relative;
  z-index:1;
  height:100vh;
  padding:24px 30px 26px;
}
.hud{
  height:100%;
  display:grid;
  grid-template-rows:76px minmax(0,1fr) 118px;
  gap:18px;
}
.top{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  border:1px solid rgba(255,255,255,.14);
  border-radius:24px;
  background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.055));
  backdrop-filter:blur(26px) saturate(150%);
  box-shadow:0 24px 70px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.16);
}
.brand{
  padding-left:24px;
  font-weight:800;
  letter-spacing:2.5px;
  color:#dfe6ff;
}
.brand small{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:3px;
  font-weight:500;
}
.title{text-align:center}
.title h1{
  margin:0;
  font-size:27px;
  letter-spacing:5px;
  font-weight:900;
  background:linear-gradient(135deg,#fff,var(--gold-2) 45%,#b8f7ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.title span{
  display:block;
  margin-top:4px;
  color:#c7d2fe;
  font-size:12px;
  letter-spacing:5px;
}
.clock{
  justify-self:end;
  margin-right:24px;
  color:#c6d3ff;
  font-size:13px;
  font-weight:600;
  border:1px solid rgba(255,255,255,.12);
  border-radius:999px;
  padding:9px 12px;
  background:rgba(255,255,255,.055);
}
.main{
  display:grid;
  grid-template-columns:286px minmax(0,1fr) 310px;
  gap:18px;
  min-height:0;
}
.panel{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.14);
  border-radius:26px;
  background:linear-gradient(145deg,rgba(255,255,255,.125),rgba(255,255,255,.045));
  backdrop-filter:blur(24px) saturate(145%);
  box-shadow:0 24px 76px rgba(5,7,24,.34),inset 0 1px rgba(255,255,255,.15);
}
.panel::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 32%,transparent 72%,rgba(6,182,212,.10));
}
.panel h2{
  position:relative;
  z-index:1;
  margin:0;
  padding:16px 18px 14px;
  font-size:15px;
  font-weight:800;
  letter-spacing:1.2px;
  color:#f7fbff;
  border-bottom:1px solid rgba(255,255,255,.10);
}
.console{position:relative;z-index:1;padding:17px}
.console textarea{
  width:100%;
  height:118px;
  resize:none;
  outline:none;
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;
  color:var(--text);
  background:rgba(8,12,36,.38);
  padding:15px;
  line-height:1.65;
  box-shadow:inset 0 1px 18px rgba(0,0,0,.12);
}
.console textarea:focus{
  border-color:rgba(6,182,212,.52);
  box-shadow:0 0 0 5px rgba(6,182,212,.09);
}
.btn{
  width:100%;
  margin-top:13px;
  padding:14px 18px;
  border:0;
  border-radius:999px;
  color:#07111f;
  font-weight:900;
  letter-spacing:1px;
  background:linear-gradient(135deg,var(--gold-2),var(--gold) 45%,#67e8f9);
  box-shadow:0 16px 34px rgba(6,182,212,.18),0 12px 32px rgba(255,224,138,.18);
  cursor:pointer;
  transition:transform .22s cubic-bezier(.2,.9,.2,1),box-shadow .22s;
}
.btn:hover{transform:translateY(-2px) scale(1.015);box-shadow:0 20px 42px rgba(6,182,212,.24),0 18px 40px rgba(255,224,138,.22)}
.metric{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:12px 17px;
  padding:13px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.metric span{color:var(--muted);font-size:12px}
.metric b{font-size:25px;font-weight:800;letter-spacing:-.5px}
.topology{
  position:relative;
  min-height:570px;
}
.topology::before{
  content:"";
  position:absolute;
  left:50%;
  top:52%;
  width:680px;
  height:420px;
  transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(99,102,241,.13),transparent 72%);
  filter:blur(12px);
  pointer-events:none;
}
.node{
  position:absolute;
  z-index:2;
  width:156px;
  min-height:80px;
  padding:14px 13px;
  text-align:center;
  border:1px solid rgba(255,255,255,.18);
  border-radius:22px;
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
  backdrop-filter:blur(22px) saturate(150%);
  box-shadow:0 18px 48px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.18);
  transition:transform .28s cubic-bezier(.2,1.4,.35,1),border-color .28s,box-shadow .28s,opacity .28s;
}
.node:hover{
  transform:translateY(-7px) scale(1.035);
  border-color:rgba(255,224,138,.50);
  box-shadow:0 24px 62px rgba(0,0,0,.26),0 0 34px rgba(99,102,241,.22);
}
.node b{display:block;font-size:15px;font-weight:900;letter-spacing:.4px}
.node span{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.node.president{
  left:50%;
  top:20px;
  transform:translateX(-50%);
  border-color:rgba(255,224,138,.52);
  box-shadow:0 20px 62px rgba(0,0,0,.26),0 0 36px rgba(255,224,138,.18);
}
.node.president:hover{transform:translateX(-50%) translateY(-7px) scale(1.035)}
.node.ceo{
  left:50%;
  top:136px;
  transform:translateX(-50%);
  border-color:rgba(6,182,212,.36);
}
.node.ceo:hover{transform:translateX(-50%) translateY(-7px) scale(1.035)}
.node.dept{width:142px}
.n0{left:7%;top:285px}.n1{left:19%;top:405px}.n2{left:31%;top:285px}.n3{left:43%;top:405px}.n4{left:55%;top:285px}.n5{left:67%;top:405px}.n6{left:79%;top:285px}.n7{left:14%;top:535px}.n8{left:74%;top:535px}
.node.idle{opacity:.76}
.node.running{
  border-color:rgba(6,182,212,.66);
  animation:gradientPulse 1.15s ease-in-out infinite alternate;
}
.node.done{
  border-color:rgba(90,242,161,.66);
  box-shadow:0 18px 48px rgba(0,0,0,.22),0 0 28px rgba(90,242,161,.22);
}
.node.done::after{
  content:"";
  position:absolute;
  inset:-8px;
  border-radius:28px;
  border:1px solid rgba(90,242,161,.36);
  animation:celebrate 1.2s ease-out 2;
  pointer-events:none;
}
.node.error{
  border-color:rgba(255,92,138,.78);
  animation:errorPop .55s ease-in-out infinite alternate;
}
.line{
  position:absolute;
  z-index:1;
  height:2px;
  transform-origin:left center;
  opacity:.84;
  overflow:hidden;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,rgba(99,102,241,.78),rgba(6,182,212,.88),transparent);
  box-shadow:0 0 14px rgba(6,182,212,.26);
}
.line::before{
  content:"";
  position:absolute;
  inset:-10px 0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  opacity:.45;
}
.line::after{
  content:"";
  position:absolute;
  top:-3px;
  left:-18px;
  width:18px;
  height:8px;
  border-radius:999px;
  background:linear-gradient(90deg,var(--gold-2),#67e8f9);
  box-shadow:0 0 16px rgba(103,232,249,.9),0 0 18px rgba(255,224,138,.65);
  animation:flow 1.12s linear infinite;
}
.l1{left:50%;top:104px;width:112px;transform:rotate(90deg)}
.l2{left:50%;top:220px;width:280px;transform:rotate(118deg)}
.l3{left:50%;top:220px;width:270px;transform:rotate(62deg)}
.l4{left:50%;top:220px;width:250px;transform:rotate(90deg)}
.l5{left:18%;top:370px;width:660px}
.feed{
  position:relative;
  z-index:1;
  height:calc(100% - 50px);
  padding:14px 17px;
  overflow:hidden;
  font-size:12.5px;
  color:#c6d3ff;
}
.feed p{
  margin:0 0 11px;
  padding:9px 10px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:14px;
  background:rgba(255,255,255,.045);
}
.bottom{
  display:grid;
  grid-template-columns:1fr 1.2fr 1fr;
  gap:18px;
}
.summary{
  position:relative;
  z-index:1;
  padding:15px 18px;
  color:var(--muted);
  font-size:14px;
  line-height:1.65;
}
.summary.show{
  color:#f8fbff;
  animation:summaryRise .42s ease both;
}
.bar{
  height:9px;
  margin:12px 0 10px;
  border-radius:999px;
  background:rgba(255,255,255,.075);
  overflow:hidden;
}
.bar i{
  display:block;
  height:100%;
  width:0;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--indigo),var(--cyan),var(--gold));
  transition:width .5s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 0 16px rgba(6,182,212,.45);
}
@keyframes gradientPulse{
  from{box-shadow:0 18px 48px rgba(0,0,0,.22),0 0 0 rgba(99,102,241,0),inset 0 0 0 rgba(6,182,212,0)}
  to{box-shadow:0 24px 64px rgba(0,0,0,.24),0 0 34px rgba(99,102,241,.42),inset 0 0 28px rgba(6,182,212,.16)}
}
@keyframes celebrate{
  from{opacity:.75;transform:scale(.96)}
  to{opacity:0;transform:scale(1.18)}
}
@keyframes errorPop{
  to{box-shadow:0 20px 58px rgba(0,0,0,.24),0 0 30px rgba(255,92,138,.42)}
}
@keyframes flow{to{left:100%}}
@keyframes summaryRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="screen">
  <div class="hud">
    <header class="top">
      <div class="brand">SOURCEFLOW OS<small>AI ORG TOPOLOGY</small></div>
      <div class="title"><h1>源流决策台</h1><span>年轻化拓扑玻璃风</span></div>
      <div class="clock" id="clock"></div>
    </header>

    <main class="main">
      <aside class="panel">
        <h2>任务控制台</h2>
        <div class="console">
          <textarea id="q">评估多AI协同决策工作台的最小验证路径。</textarea>
          <button class="btn" id="start">开始分析</button>
        </div>
        <div class="metric"><span>组织节点</span><b>11</b></div>
        <div class="metric"><span>并行部门</span><b>9</b></div>
        <div class="metric"><span>当前阶段</span><b id="stage">待命</b></div>
      </aside>

      <section class="panel topology" id="topology">
        <div class="line l1"></div>
        <div class="line l2"></div>
        <div class="line l3"></div>
        <div class="line l4"></div>
        <div class="line l5"></div>
      </section>

      <aside class="panel">
        <h2>协同日志</h2>
        <div class="feed" id="feed"><p>[00:00:00] 系统待命，等待总裁下达任务。</p></div>
      </aside>
    </main>

    <footer class="bottom">
      <section class="panel">
        <h2>拆解进度</h2>
        <div class="summary">需求识别<div class="bar"><i id="p1"></i></div>角色分发<div class="bar"><i id="p2"></i></div></div>
      </section>
      <section class="panel">
        <h2>执行总裁汇总</h2>
        <div class="summary" id="summary">分析完成后生成跨部门简报。</div>
      </section>
      <section class="panel">
        <h2>异常与提醒</h2>
        <div class="summary" id="alerts">暂无异常。</div>
      </section>
    </footer>
  </div>
</div>

<script>
const roles=["总裁","执行总裁","战略部","市场部","产品部","技术部","财务部","风险部","运营部","法务部","自定义部"];
const pos=["president","ceo","dept n0","dept n1","dept n2","dept n3","dept n4","dept n5","dept n6","dept n7","dept n8"];
const topo=document.getElementById("topology");

roles.forEach((role,index)=>{
  const node=document.createElement("div");
  node.className="node idle "+pos[index];
  node.dataset.index=index;
  node.innerHTML=`<b>${role}</b><span>${index<2?"指挥层":"并行分析节点"}</span>`;
  topo.appendChild(node);
});

function log(text){
  feed.innerHTML=`<p>[${new Date().toLocaleTimeString()}] ${text}</p>`+feed.innerHTML;
}

function setNodes(status){
  document.querySelectorAll(".node").forEach(node=>{
    node.classList.remove("idle","running","done","error");
    node.classList.add(status);
  });
}

function setNode(index,status){
  const node=document.querySelector(`[data-index="${index}"]`);
  node.className="node "+status+" "+pos[index];
}

start.onclick=()=>{
  setNodes("idle");
  summary.textContent="执行中：等待各部门回传。";
  summary.classList.remove("show");
  alerts.textContent="暂无异常。";
  stage.textContent="拆解";
  p1.style.width="0";
  p2.style.width="0";
  log("总裁任务已接收，执行总裁开始拆解。");
  setNode(1,"running");

  setTimeout(()=>{
    p1.style.width="100%";
    stage.textContent="分发";
    log("任务拆解完成，9 个部门进入并行执行。");
    setNode(1,"done");

    for(let index=2;index<11;index++){
      setTimeout(()=>{
        setNode(index,"running");
        log(roles[index]+" 正在回传分析数据。");
        setTimeout(()=>{
          setNode(index,"done");
          log(roles[index]+" 已完成。");
          if(index===10){
            p2.style.width="100%";
            stage.textContent="汇总";
            summary.textContent="汇总结论：建议以自用验证优先，重点监控 API Key 门槛、连续使用频率、单次决策耗时和最终输出质量。";
            summary.classList.add("show");
            alerts.textContent="提醒：若 30 天内无法形成高频使用，应停止商业化投入。";
            stage.textContent="完成";
          }
        },760);
      },(index-2)*260);
    }
  },1300);
};

setInterval(()=>{clock.textContent=new Date().toLocaleString();},1000);
clock.textContent=new Date().toLocaleString();
</script>
</body>
</html>
