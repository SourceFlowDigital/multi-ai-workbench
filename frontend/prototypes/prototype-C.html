<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prototype C · 科幻沉浸风</title>
<style>
*{box-sizing:border-box}body{margin:0;min-width:1280px;height:100vh;overflow:hidden;background:#030611;color:#eef7ff;font-family:"Microsoft YaHei",Arial,sans-serif}.space{position:relative;height:100vh;perspective:1100px;background:radial-gradient(circle at 50% 45%,rgba(56,120,255,.24),transparent 34%),radial-gradient(circle at 20% 75%,rgba(201,168,76,.12),transparent 28%),linear-gradient(180deg,#081224,#030611)}.space:before{content:"";position:absolute;inset:-20%;background:repeating-radial-gradient(circle at 50% 50%,rgba(120,190,255,.13) 0 1px,transparent 1px 90px);transform:rotateX(68deg) translateY(120px);opacity:.45}.nav{position:absolute;left:38px;right:38px;top:28px;z-index:5;display:flex;justify-content:space-between;align-items:center}.brand{letter-spacing:4px;font-weight:800}.brand span{display:block;margin-top:6px;color:#c9a84c;font-size:11px;letter-spacing:5px}.launch{border:1px solid rgba(232,210,154,.45);background:rgba(232,210,154,.12);color:#f2d98e;border-radius:999px;padding:13px 24px;font-weight:800}.input{position:absolute;left:38px;bottom:34px;z-index:6;width:420px;padding:18px;border:1px solid rgba(150,200,255,.18);border-radius:24px;background:rgba(8,16,34,.58);backdrop-filter:blur(18px)}textarea{width:100%;height:96px;border:0;resize:none;background:transparent;color:#eef7ff;outline:none;font-size:15px}.input p{margin:10px 0 0;color:#8ba4c3;font-size:13px}.stage{position:absolute;inset:110px 40px 130px;transform-style:preserve-3d}.ring{position:absolute;left:50%;top:50%;border:1px solid rgba(100,190,255,.22);border-radius:50%;transform-style:preserve-3d;transform:translate(-50%,-50%) rotateX(68deg);box-shadow:0 0 40px rgba(40,150,255,.08)}.r1{width:820px;height:820px}.r2{width:570px;height:570px;border-color:rgba(201,168,76,.20)}.r3{width:340px;height:340px}.node{position:absolute;width:155px;min-height:86px;padding:15px;border:1px solid rgba(130,200,255,.24);border-radius:20px;background:linear-gradient(160deg,rgba(26,52,92,.58),rgba(8,16,34,.34));backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.34),0 0 26px rgba(55,130,255,.10);transform-style:preserve-3d;transition:.45s}.node b{display:block}.node span{display:block;margin-top:8px;color:#94aeca;font-size:12px}.president{left:50%;top:8%;transform:translateX(-50%) translateZ(180px);border-color:rgba(232,210,154,.48)}.ceo{left:50%;top:34%;transform:translateX(-50%) translateZ(90px)}.d0{left:15%;top:23%;transform:translateZ(30px)}.d1{left:27%;top:62%;transform:translateZ(-40px)}.d2{left:39%;top:17%;transform:translateZ(60px)}.d3{left:57%;top:61%;transform:translateZ(-30px)}.d4{left:72%;top:24%;transform:translateZ(35px)}.d5{left:8%;top:65%;transform:translateZ(-90px)}.d6{left:79%;top:65%;transform:translateZ(-80px)}.d7{left:23%;top:40%;transform:translateZ(120px)}.d8{left:65%;top:42%;transform:translateZ(110px)}.beam{position:absolute;left:50%;top:43%;width:2px;height:400px;background:linear-gradient(transparent,#55dfff,transparent);box-shadow:0 0 20px #55dfff;opacity:.35;transform-origin:top}.b0{transform:rotate(18deg)}.b1{transform:rotate(62deg)}.b2{transform:rotate(108deg)}.b3{transform:rotate(154deg)}.b4{transform:rotate(220deg)}.b5{transform:rotate(282deg)}.idle{opacity:.72}.running{border-color:#65e8ff;animation:float 1.2s infinite alternate;box-shadow:0 24px 70px rgba(0,0,0,.42),0 0 42px rgba(101,232,255,.28)}.done{border-color:#66ee9a;box-shadow:0 0 35px rgba(102,238,154,.18)}.summary{position:absolute;right:38px;bottom:34px;z-index:6;width:470px;min-height:150px;padding:20px;border:1px solid rgba(232,210,154,.25);border-radius:26px;background:rgba(8,16,34,.62);backdrop-filter:blur(20px);opacity:.72}.summary.show{opacity:1;box-shadow:0 0 40px rgba(232,210,154,.12)}.summary h2{margin:0 0 10px;font-size:18px}.summary p{margin:0;color:#9fb4d0;line-height:1.8}.status{position:absolute;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);text-align:center}.status strong{font-size:48px;letter-spacing:6px;text-shadow:0 0 28px rgba(110,220,255,.5)}.status span{display:block;margin-top:8px;color:#c9a84c;letter-spacing:5px;font-size:12px}@keyframes float{to{margin-top:-12px}}
</style>
</head>
<body>
<div class="space">
<nav class="nav"><div class="brand">源流决策台<span>SCI-FI IMMERSIVE PROTOTYPE</span></div><button class="launch" id="start">开始分析</button></nav>
<section class="input"><textarea id="q">请评估多AI协同决策工作台的产品方向、风险和下一步。</textarea><p>沉浸式组织空间：总裁下达任务，执行总裁调度 9 部门。</p></section>
<main class="stage" id="stage"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="beam b0"></div><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div><div class="beam b4"></div><div class="beam b5"></div><div class="status"><strong id="phase">待命</strong><span>AI ORG SPACE</span></div></main>
<section class="summary" id="summary"><h2>汇总输出</h2><p>分析完成后，执行总裁会把各部门判断压缩为可行动的下一步。</p></section>
</div>
<script>
const names=["总裁","执行总裁","战略部","市场部","产品部","技术部","财务部","风险部","运营部","法务部","自定义部"],cls=["president","ceo","d0","d1","d2","d3","d4","d5","d6","d7","d8"];names.forEach((n,i)=>{let e=document.createElement("div");e.className="node idle "+cls[i];e.dataset.i=i;e.innerHTML=`<b>${n}</b><span>${i<2?"核心指挥":"空间节点"}</span>`;stage.appendChild(e)});
start.onclick=()=>{summary.classList.remove("show");summary.querySelector("p").textContent="各节点正在进入分析轨道。";phase.textContent="拆解";document.querySelectorAll(".node").forEach(n=>{n.classList.remove("running","done");n.classList.add("idle")});document.querySelector('[data-i="1"]').className="node running ceo";setTimeout(()=>{document.querySelector('[data-i="1"]').className="node done ceo";phase.textContent="并行";for(let i=2;i<11;i++){setTimeout(()=>{let n=document.querySelector(`[data-i="${i}"]`);n.className="node running "+cls[i];setTimeout(()=>{n.className="node done "+cls[i];if(i===10){phase.textContent="完成";summary.classList.add("show");summary.querySelector("p").textContent="共识：先验证交互价值，再谈商业化。关键指标是连续使用频率、API Key 配置接受度、并行输出是否明显提升决策质量。"}} ,900)},(i-2)*300)}},1400)}
</script>
</body>
</html>
