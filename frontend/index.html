<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>源流决策台 · 多AI协同工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
:root{
  --navy:#060e1c;
  --purple:#0f0a24;
  --purple-2:#1a1038;
  --blue:#3d86d8;
  --blue-soft:#75b7ff;
  --gold:#E8C86F;
  --gold-deep:#A47330;
  --gold-light:#FDFAC5;
  --green:#10B981;
  --red:#ff5f86;
  --text:#f4f7ff;
  --muted:#a9b5cf;
  --glass:rgba(255,255,255,.105);
  --line:rgba(255,255,255,.15);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-width:1280px;
  height:100vh;
  overflow:hidden;
  color:var(--text);
  font-family:"Inter","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(900px 580px at 18% 12%,rgba(61,134,216,.26),transparent 62%),
    radial-gradient(820px 560px at 82% 16%,rgba(232,200,111,.14),transparent 58%),
    radial-gradient(900px 620px at 54% 104%,rgba(94,56,180,.28),transparent 66%),
    linear-gradient(135deg,var(--navy) 0%,#0b1230 42%,var(--purple) 100%);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 15% 26%,rgba(253,250,197,.10),transparent 2px),
    radial-gradient(circle at 74% 18%,rgba(117,183,255,.11),transparent 1.8px),
    radial-gradient(circle at 88% 74%,rgba(253,250,197,.08),transparent 1.7px),
    radial-gradient(circle at 34% 86%,rgba(117,183,255,.08),transparent 1.8px);
  opacity:.58;
}
.screen{
  position:relative;
  z-index:1;
  height:100vh;
  padding:24px 30px 26px;
}
.hud{
  height:100%;
  display:grid;
  grid-template-rows:76px minmax(0,1fr) 118px;
  gap:18px;
}
.top{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  border:1px solid rgba(255,255,255,.14);
  border-radius:24px;
  background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.045));
  backdrop-filter:blur(28px) saturate(150%);
  box-shadow:0 24px 70px rgba(1,3,15,.32),inset 0 1px rgba(255,255,255,.18);
}
.brand{
  padding-left:24px;
  color:#eef4ff;
  font-size:17px;
  font-weight:900;
  letter-spacing:2px;
}
.brand small{
  display:block;
  margin-top:5px;
  color:var(--gold);
  font-size:10px;
  font-weight:700;
  letter-spacing:3px;
}
.title{text-align:center}
.title h1{
  margin:0;
  font-size:27px;
  font-weight:900;
  letter-spacing:5px;
  background:linear-gradient(135deg,#fff,var(--gold-light) 42%,var(--gold));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.title span{
  display:block;
  margin-top:4px;
  color:#c9d8f2;
  font-size:12px;
  letter-spacing:5px;
}
.clock{
  justify-self:end;
  margin-right:24px;
  padding:9px 12px;
  color:#dce9ff;
  border:1px solid rgba(255,255,255,.13);
  border-radius:999px;
  background:rgba(255,255,255,.055);
  font-size:13px;
  font-weight:600;
}
.main{
  min-height:0;
  display:grid;
  grid-template-columns:310px minmax(0,1fr) 310px;
  gap:18px;
}
.panel{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:26px;
  background:linear-gradient(145deg,rgba(255,255,255,.125),rgba(255,255,255,.042));
  backdrop-filter:blur(26px) saturate(145%);
  box-shadow:0 24px 76px rgba(1,3,18,.34),inset 0 1px rgba(255,255,255,.16);
}
.panel::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(253,250,197,.105),transparent 30%,transparent 72%,rgba(61,134,216,.11));
}
.panel h2{
  position:relative;
  z-index:1;
  margin:0;
  padding:16px 18px 14px;
  color:var(--gold-light);
  border-bottom:1px solid rgba(255,255,255,.10);
  font-size:15px;
  font-weight:850;
  letter-spacing:1.3px;
}
.panel-body{
  position:relative;
  z-index:1;
  padding:14px 17px;
  overflow-y:auto;
}
.panel-body::-webkit-scrollbar{width:4px}
.panel-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}

/* ── 输入区 ── */
.input-group{margin-bottom:12px}
.input-group label{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-bottom:4px;
  letter-spacing:.5px;
}
.input-group input, .input-group textarea{
  width:100%;
  padding:9px 11px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  background:rgba(6,14,28,.40);
  color:var(--text);
  font-size:13px;
  outline:none;
  transition:border-color .2s;
  font-family:inherit;
}
.input-group input:focus, .input-group textarea:focus{
  border-color:rgba(232,200,111,.55);
  box-shadow:0 0 0 4px rgba(232,200,111,.08);
}
.input-group textarea{resize:none;height:71px}
.btn{
  width:100%;
  margin-top:10px;
  padding:13px 18px;
  border:0;
  border-radius:999px;
  color:#17100a;
  background:linear-gradient(135deg,var(--gold-light),var(--gold) 52%,#ffd66f);
  box-shadow:0 16px 36px rgba(232,200,111,.23),0 12px 34px rgba(61,134,216,.12);
  font-weight:900;
  font-size:14px;
  letter-spacing:1px;
  cursor:pointer;
  transition:transform .22s cubic-bezier(.2,.9,.2,1),box-shadow .22s;
}
.btn:hover{
  transform:translateY(-2px) scale(1.01);
  box-shadow:0 22px 44px rgba(232,200,111,.30),0 16px 38px rgba(61,134,216,.16);
}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ── API Key 区 ── */
.apikey-section{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.06)}
.apikey-section summary{
  color:var(--muted);
  font-size:11px;
  cursor:pointer;
  letter-spacing:1px;
  margin-bottom:8px;
}
.apikey-input{
  width:100%;
  padding:6px 9px;
  margin-bottom:5px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:8px;
  background:rgba(6,14,28,.35);
  color:var(--text);
  font-size:11px;
  outline:none;
  font-family:monospace;
}
.apikey-input:focus{border-color:rgba(61,134,216,.45)}
.apikey-label{font-size:10px;color:var(--muted);margin-bottom:3px;display:block}

/* ── 勾选列表 ── */
.checklist{max-height:200px;overflow-y:auto}
.checklist label{
  display:flex;
  align-items:center;
  padding:5px 0;
  cursor:pointer;
  font-size:11px;
  gap:6px;
  transition:color .2s;
}
.checklist label:hover{color:#fff}
.checklist input[type=checkbox]{accent-color:var(--gold)}

/* ── 指标 ── */
.metric{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 17px;
  padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.metric span{color:var(--muted);font-size:12px}
.metric b{color:#fff;font-size:23px;font-weight:850;letter-spacing:-.5px}

/* ── 拓扑区 ── */
.topology{
  position:relative;
  min-height:570px;
}
.topology::before{
  content:"";
  position:absolute;
  left:50%;
  top:52%;
  width:690px;
  height:430px;
  transform:translate(-50%,-50%);
  background:
    radial-gradient(closest-side,rgba(61,134,216,.13),transparent 70%),
    radial-gradient(closest-side,rgba(232,200,111,.06),transparent 76%);
  filter:blur(16px);
  pointer-events:none;
}
.node{
  position:absolute;
  z-index:2;
  width:140px;
  min-height:68px;
  padding:12px 11px;
  text-align:center;
  border:1px solid rgba(255,255,255,.18);
  border-radius:22px;
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.055));
  backdrop-filter:blur(22px) saturate(150%);
  box-shadow:0 18px 48px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.18);
  transition:transform .28s cubic-bezier(.2,1.4,.35,1),border-color .28s,box-shadow .28s,opacity .28s;
}
.node:hover{
  transform:translateY(-6px) scale(1.03);
  border-color:rgba(253,250,197,.56);
  box-shadow:0 24px 62px rgba(0,0,0,.26),0 0 34px rgba(232,200,111,.18);
}
.node b{display:block;font-size:13px;font-weight:900;letter-spacing:.3px}
.node span{display:block;margin-top:5px;color:var(--muted);font-size:10px}
.node.president{
  left:50%;top:20px;transform:translateX(-50%);
  border-color:rgba(253,250,197,.58);
  box-shadow:0 20px 62px rgba(0,0,0,.26),0 0 38px rgba(232,200,111,.22);
}
.node.president:hover{transform:translateX(-50%) translateY(-6px) scale(1.03)}
.node.ceo{
  left:50%;top:130px;transform:translateX(-50%);
  border-color:rgba(232,200,111,.48);
  box-shadow:0 20px 58px rgba(0,0,0,.24),0 0 28px rgba(232,200,111,.13);
}
.node.ceo:hover{transform:translateX(-50%) translateY(-6px) scale(1.03)}
.node.dept{width:128px;border-color:rgba(61,134,216,.40)}
.n0{left:7%;top:270px}
.n1{left:20%;top:380px}
.n2{left:33%;top:270px}
.n3{left:46%;top:380px}
.n4{left:59%;top:270px}
.n5{left:72%;top:380px}
.n6{left:80%;top:270px}
.n7{left:15%;top:510px}
.n8{left:73%;top:510px}
.node.idle{opacity:.78}
.node.running{
  animation:runningPulse 1.12s ease-in-out infinite alternate;
}
.node.done{
  border-color:rgba(16,185,129,.72);
  box-shadow:0 18px 48px rgba(0,0,0,.22),0 0 28px rgba(16,185,129,.24);
}
.node.done::after{
  content:"";
  position:absolute;
  inset:-8px;
  border:1px solid rgba(16,185,129,.42);
  border-radius:30px;
  animation:successRing 1.18s ease-out 2;
  pointer-events:none;
}
.node.error{
  border-color:rgba(255,95,134,.78);
  animation:errorPulse .55s ease-in-out infinite alternate;
}
.line{
  position:absolute;
  z-index:1;
  height:2px;
  overflow:hidden;
  border-radius:999px;
  opacity:.86;
  transform-origin:left center;
  background:linear-gradient(90deg,transparent,rgba(61,134,216,.72),rgba(117,183,255,.86),transparent);
  box-shadow:0 0 14px rgba(61,134,216,.28);
}
.line.gold-line{
  background:linear-gradient(90deg,transparent,rgba(164,115,48,.58),rgba(232,200,111,.92),rgba(253,250,197,.76),transparent);
  box-shadow:0 0 16px rgba(232,200,111,.32);
}
.line::after{
  content:"";
  position:absolute;
  top:-3px;
  left:-18px;
  width:18px;
  height:8px;
  border-radius:999px;
  background:linear-gradient(90deg,var(--gold-light),var(--gold));
  box-shadow:0 0 18px rgba(253,250,197,.84),0 0 18px rgba(232,200,111,.64);
  animation:flow 1.08s linear infinite;
}
.line.blue-particle::after{
  background:linear-gradient(90deg,#d8ebff,var(--blue-soft));
  box-shadow:0 0 18px rgba(61,134,216,.82),0 0 16px rgba(117,183,255,.58);
}
.l1{left:50%;top:100px;width:100px;transform:rotate(90deg)}
.l2{left:50%;top:214px;width:270px;transform:rotate(118deg)}
.l3{left:50%;top:214px;width:260px;transform:rotate(62deg)}
.l4{left:50%;top:214px;width:240px;transform:rotate(90deg)}
.l5{left:18%;top:350px;width:620px}

/* ── 日志与汇总 ── */
.feed{
  position:relative;
  z-index:1;
  height:calc(100% - 50px);
  padding:12px 16px;
  overflow-y:auto;
  font-size:12px;
  color:#d7e4fb;
}
.feed p{
  margin:0 0 9px;
  padding:8px 10px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  background:rgba(255,255,255,.04);
  line-height:1.5;
}
.feed::-webkit-scrollbar{width:4px}
.feed::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
.bottom{
  display:grid;
  grid-template-columns:1fr 1.2fr 1fr;
  gap:18px;
}
.summary{
  position:relative;
  z-index:1;
  padding:14px 17px;
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  max-height:100px;
  overflow-y:auto;
}
.summary.show{color:#fff;animation:summaryRise .42s ease both}
.bar{
  height:8px;
  margin:10px 0 8px;
  overflow:hidden;
  border-radius:999px;
  background:rgba(255,255,255,.07);
}
.bar i{
  display:block;
  width:0;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--blue),var(--gold),var(--gold-light));
  box-shadow:0 0 16px rgba(232,200,111,.32);
  transition:width .5s cubic-bezier(.2,.8,.2,1);
}

/* ── 历史列表 ── */
.hist-item:hover{background:rgba(255,255,255,.04)}

/* ── 动画 ── */
@keyframes runningPulse{
  from{box-shadow:0 18px 48px rgba(0,0,0,.22),0 0 0 rgba(61,134,216,0),inset 0 0 0 rgba(232,200,111,0)}
  to{box-shadow:0 24px 64px rgba(0,0,0,.24),0 0 34px rgba(61,134,216,.34),0 0 28px rgba(232,200,111,.16),inset 0 0 26px rgba(117,183,255,.12)}
}
@keyframes successRing{
  from{opacity:.78;transform:scale(.96)}
  to{opacity:0;transform:scale(1.18)}
}
@keyframes errorPulse{
  to{box-shadow:0 20px 58px rgba(0,0,0,.24),0 0 30px rgba(255,95,134,.42)}
}
@keyframes flow{to{left:100%}}
@keyframes summaryRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="screen">
  <div class="hud">

    <!-- ═══ 顶部导航 ═══ -->
    <header class="top">
      <div class="brand">SOURCEFLOW OS<small>MULTI-AI WORKBENCH</small></div>
      <div class="title"><h1>源流决策台</h1><span>多AI协同决策工作台</span></div>
      <div class="clock" id="clock"></div>
    </header>

    <!-- ═══ 主体三栏 ═══ -->
    <main class="main">

      <!-- 左栏：控制台 -->
      <aside class="panel" style="display:flex;flex-direction:column">
        <h2>任务控制台</h2>
        <div class="panel-body" style="flex:1;display:flex;flex-direction:column">

          <!-- API Key 配置 -->
          <details class="apikey-section" open>
            <summary>🔑 API Key 配置（浏览器本地存储）</summary>
            <span class="apikey-label">Claude API Key</span>
            <input class="apikey-input" id="apikey-claude" data-model="claude" placeholder="sk-ant-..." autocomplete="off">
            <span class="apikey-label">DeepSeek API Key</span>
            <input class="apikey-input" id="apikey-deepseek" data-model="deepseek" placeholder="sk-..." autocomplete="off">
            <span class="apikey-label">GPT API Key</span>
            <input class="apikey-input" id="apikey-gpt" data-model="gpt" placeholder="sk-..." autocomplete="off">
          </details>

          <!-- 任务输入 -->
          <div class="input-group">
            <label>任务标题</label>
            <input type="text" id="task-input-title" placeholder="例：评估多AI协同工作台最小验证路径" value="评估多AI协同决策工作台的最小验证路径">
          </div>
          <div class="input-group">
            <label>任务详细描述</label>
            <textarea id="task-input-desc" placeholder="描述你希望 AI 团队分析的问题...">请从技术可行性、用户价值、市场机会三个维度，评估多AI协同决策工作台的最小验证路径。重点关注：API Key门槛对用户转化率的影响、多AI并行比单AI串行的效率提升幅度、以及商业化定价策略。</textarea>
          </div>

          <!-- 角色选择 -->
          <div class="input-group">
            <label>🎭 执行角色</label>
            <div class="checklist" id="role-checklist"></div>
          </div>

          <!-- 模型选择 -->
          <div class="input-group">
            <label>🤖 AI 模型</label>
            <div class="checklist" id="model-checklist"></div>
          </div>

          <button class="btn" id="start">▶ 开始分析</button>

          <div style="margin-top:14px">
            <div class="metric"><span>可用角色</span><b id="count-roles">-</b></div>
            <div class="metric"><span>可选模型</span><b id="count-models">-</b></div>
            <div class="metric"><span>当前阶段</span><b id="stage">待命</b></div>
          </div>
        </div>
      </aside>

      <!-- 中栏：拓扑图 + 历史 -->
      <section>
        <div class="panel topology" id="topology" style="height:60%">
          <div class="line gold-line l1"></div>
          <div class="line gold-line l2"></div>
          <div class="line blue-particle l3"></div>
          <div class="line gold-line l4"></div>
          <div class="line blue-particle l5"></div>
        </div>
        <div class="panel" style="height:calc(40% - 18px);margin-top:18px">
          <h2>📋 历史任务</h2>
          <div class="panel-body" id="history-list" style="max-height:calc(100% - 50px);overflow-y:auto">
            <div class="hist-item"><span>加载中...</span></div>
          </div>
        </div>
      </section>

      <!-- 右栏：协同日志 -->
      <aside class="panel">
        <h2>协同日志</h2>
        <div class="feed" id="feed"><p>[系统] 正在初始化...</p></div>
      </aside>
    </main>

    <!-- ═══ 底部三栏 ═══ -->
    <footer class="bottom">
      <section class="panel">
        <h2>拆解进度</h2>
        <div class="summary">
          需求识别<div class="bar"><i id="p1"></i></div>
          角色执行<div class="bar"><i id="p2"></i></div>
        </div>
      </section>
      <section class="panel">
        <h2>执行经理汇总</h2>
        <div class="summary" id="summary">等待下达任务。</div>
      </section>
      <section class="panel">
        <h2>异常与提醒</h2>
        <div class="summary" id="alerts">暂无异常。</div>
      </section>
    </footer>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
