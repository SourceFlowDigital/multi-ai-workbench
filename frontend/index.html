<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prototype E · 品牌金蓝拓扑改版</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
:root{
  --navy:#060e1c;
  --purple:#0f0a24;
  --purple-2:#1a1038;
  --blue:#3d86d8;
  --blue-soft:#75b7ff;
  --gold:#E8C86F;
  --gold-deep:#A47330;
  --gold-light:#FDFAC5;
  --green:#10B981;
  --red:#ff5f86;
  --text:#f4f7ff;
  --muted:#a9b5cf;
  --glass:rgba(255,255,255,.105);
  --line:rgba(255,255,255,.15);
}
*{box-sizing:border-box}
body{
  margin:0;
  min-width:1280px;
  height:100vh;
  overflow:hidden;
  color:var(--text);
  font-family:"Inter","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(900px 580px at 18% 12%,rgba(61,134,216,.26),transparent 62%),
    radial-gradient(820px 560px at 82% 16%,rgba(232,200,111,.14),transparent 58%),
    radial-gradient(900px 620px at 54% 104%,rgba(94,56,180,.28),transparent 66%),
    linear-gradient(135deg,var(--navy) 0%,#0b1230 42%,var(--purple) 100%);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 15% 26%,rgba(253,250,197,.10),transparent 2px),
    radial-gradient(circle at 74% 18%,rgba(117,183,255,.11),transparent 1.8px),
    radial-gradient(circle at 88% 74%,rgba(253,250,197,.08),transparent 1.7px),
    radial-gradient(circle at 34% 86%,rgba(117,183,255,.08),transparent 1.8px);
  opacity:.58;
}
.screen{
  position:relative;
  z-index:1;
  height:100vh;
  padding:24px 30px 26px;
}
.hud{
  height:100%;
  display:grid;
  grid-template-rows:76px minmax(0,1fr) 118px;
  gap:18px;
}
.top{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  border:1px solid rgba(255,255,255,.14);
  border-radius:24px;
  background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.045));
  backdrop-filter:blur(28px) saturate(150%);
  box-shadow:0 24px 70px rgba(1,3,15,.32),inset 0 1px rgba(255,255,255,.18);
}
.brand{
  padding-left:24px;
  color:#eef4ff;
  font-size:17px;
  font-weight:900;
  letter-spacing:2px;
}
.brand small{
  display:block;
  margin-top:5px;
  color:var(--gold);
  font-size:10px;
  font-weight:700;
  letter-spacing:3px;
}
.title{text-align:center}
.title h1{
  margin:0;
  font-size:27px;
  font-weight:900;
  letter-spacing:5px;
  background:linear-gradient(135deg,#fff,var(--gold-light) 42%,var(--gold));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.title span{
  display:block;
  margin-top:4px;
  color:#c9d8f2;
  font-size:12px;
  letter-spacing:5px;
}
.clock{
  justify-self:end;
  margin-right:24px;
  padding:9px 12px;
  color:#dce9ff;
  border:1px solid rgba(255,255,255,.13);
  border-radius:999px;
  background:rgba(255,255,255,.055);
  font-size:13px;
  font-weight:600;
}
.main{
  min-height:0;
  display:grid;
  grid-template-columns:286px minmax(0,1fr) 310px;
  gap:18px;
}
.panel{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:26px;
  background:linear-gradient(145deg,rgba(255,255,255,.125),rgba(255,255,255,.042));
  backdrop-filter:blur(26px) saturate(145%);
  box-shadow:0 24px 76px rgba(1,3,18,.34),inset 0 1px rgba(255,255,255,.16);
}
.panel::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(253,250,197,.105),transparent 30%,transparent 72%,rgba(61,134,216,.11));
}
.panel h2{
  position:relative;
  z-index:1;
  margin:0;
  padding:16px 18px 14px;
  color:var(--gold-light);
  border-bottom:1px solid rgba(255,255,255,.10);
  font-size:15px;
  font-weight:850;
  letter-spacing:1.3px;
}
.console{
  position:relative;
  z-index:1;
  padding:17px;
}
.console textarea{
  width:100%;
  height:118px;
  resize:none;
  outline:none;
  color:var(--text);
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;
  background:rgba(6,14,28,.40);
  padding:15px;
  line-height:1.65;
  box-shadow:inset 0 1px 18px rgba(0,0,0,.12);
}
.console textarea:focus{
  border-color:rgba(232,200,111,.55);
  box-shadow:0 0 0 5px rgba(232,200,111,.09);
}
.btn{
  width:100%;
  margin-top:13px;
  padding:14px 18px;
  border:0;
  border-radius:999px;
  color:#17100a;
  background:linear-gradient(135deg,var(--gold-light),var(--gold) 52%,#ffd66f);
  box-shadow:0 16px 36px rgba(232,200,111,.23),0 12px 34px rgba(61,134,216,.12);
  font-weight:900;
  letter-spacing:1px;
  cursor:pointer;
  transition:transform .22s cubic-bezier(.2,.9,.2,1),box-shadow .22s;
}
.btn:hover{
  transform:translateY(-2px) scale(1.015);
  box-shadow:0 22px 44px rgba(232,200,111,.30),0 16px 38px rgba(61,134,216,.16);
}
.metric{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:12px 17px;
  padding:13px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.metric span{
  color:var(--muted);
  font-size:12px;
}
.metric b{
  color:#fff;
  font-size:25px;
  font-weight:850;
  letter-spacing:-.5px;
}
.topology{
  position:relative;
  min-height:570px;
}
.topology::before{
  content:"";
  position:absolute;
  left:50%;
  top:52%;
  width:690px;
  height:430px;
  transform:translate(-50%,-50%);
  background:
    radial-gradient(closest-side,rgba(61,134,216,.13),transparent 70%),
    radial-gradient(closest-side,rgba(232,200,111,.06),transparent 76%);
  filter:blur(16px);
  pointer-events:none;
}
.node{
  position:absolute;
  z-index:2;
  width:156px;
  min-height:80px;
  padding:14px 13px;
  text-align:center;
  border:1px solid rgba(255,255,255,.18);
  border-radius:22px;
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.055));
  backdrop-filter:blur(22px) saturate(150%);
  box-shadow:0 18px 48px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.18);
  transition:transform .28s cubic-bezier(.2,1.4,.35,1),border-color .28s,box-shadow .28s,opacity .28s;
}
.node:hover{
  transform:translateY(-7px) scale(1.035);
  border-color:rgba(253,250,197,.56);
  box-shadow:0 24px 62px rgba(0,0,0,.26),0 0 34px rgba(232,200,111,.18);
}
.node b{
  display:block;
  font-size:15px;
  font-weight:900;
  letter-spacing:.4px;
}
.node span{
  display:block;
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
}
.node.president{
  left:50%;
  top:20px;
  transform:translateX(-50%);
  border-color:rgba(253,250,197,.58);
  box-shadow:0 20px 62px rgba(0,0,0,.26),0 0 38px rgba(232,200,111,.22);
}
.node.president:hover{transform:translateX(-50%) translateY(-7px) scale(1.035)}
.node.ceo{
  left:50%;
  top:136px;
  transform:translateX(-50%);
  border-color:rgba(232,200,111,.48);
  box-shadow:0 20px 58px rgba(0,0,0,.24),0 0 28px rgba(232,200,111,.13);
}
.node.ceo:hover{transform:translateX(-50%) translateY(-7px) scale(1.035)}
.node.dept{
  width:142px;
  border-color:rgba(61,134,216,.40);
}
.n0{left:7%;top:285px}
.n1{left:19%;top:405px}
.n2{left:31%;top:285px}
.n3{left:43%;top:405px}
.n4{left:55%;top:285px}
.n5{left:67%;top:405px}
.n6{left:79%;top:285px}
.n7{left:14%;top:535px}
.n8{left:74%;top:535px}
.node.idle{opacity:.78}
.node.running{
  animation:runningPulse 1.12s ease-in-out infinite alternate;
}
.node.done{
  border-color:rgba(16,185,129,.72);
  box-shadow:0 18px 48px rgba(0,0,0,.22),0 0 28px rgba(16,185,129,.24);
}
.node.done::after{
  content:"";
  position:absolute;
  inset:-8px;
  border:1px solid rgba(16,185,129,.42);
  border-radius:30px;
  animation:successRing 1.18s ease-out 2;
  pointer-events:none;
}
.node.error{
  border-color:rgba(255,95,134,.78);
  animation:errorPulse .55s ease-in-out infinite alternate;
}
.line{
  position:absolute;
  z-index:1;
  height:2px;
  overflow:hidden;
  border-radius:999px;
  opacity:.86;
  transform-origin:left center;
  background:linear-gradient(90deg,transparent,rgba(61,134,216,.72),rgba(117,183,255,.86),transparent);
  box-shadow:0 0 14px rgba(61,134,216,.28);
}
.line.gold-line{
  background:linear-gradient(90deg,transparent,rgba(164,115,48,.58),rgba(232,200,111,.92),rgba(253,250,197,.76),transparent);
  box-shadow:0 0 16px rgba(232,200,111,.32);
}
.line::after{
  content:"";
  position:absolute;
  top:-3px;
  left:-18px;
  width:18px;
  height:8px;
  border-radius:999px;
  background:linear-gradient(90deg,var(--gold-light),var(--gold));
  box-shadow:0 0 18px rgba(253,250,197,.84),0 0 18px rgba(232,200,111,.64);
  animation:flow 1.08s linear infinite;
}
.line.blue-particle::after{
  background:linear-gradient(90deg,#d8ebff,var(--blue-soft));
  box-shadow:0 0 18px rgba(61,134,216,.82),0 0 16px rgba(117,183,255,.58);
}
.l1{left:50%;top:104px;width:112px;transform:rotate(90deg)}
.l2{left:50%;top:220px;width:280px;transform:rotate(118deg)}
.l3{left:50%;top:220px;width:270px;transform:rotate(62deg)}
.l4{left:50%;top:220px;width:250px;transform:rotate(90deg)}
.l5{left:18%;top:370px;width:660px}
.feed{
  position:relative;
  z-index:1;
  height:calc(100% - 50px);
  padding:14px 17px;
  overflow:hidden;
  color:#d7e4fb;
  font-size:12.5px;
}
.feed p{
  margin:0 0 11px;
  padding:9px 10px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:14px;
  background:rgba(255,255,255,.045);
}
.bottom{
  display:grid;
  grid-template-columns:1fr 1.2fr 1fr;
  gap:18px;
}
.summary{
  position:relative;
  z-index:1;
  padding:15px 18px;
  color:var(--muted);
  font-size:14px;
  line-height:1.65;
}
.summary.show{
  color:#fff;
  animation:summaryRise .42s ease both;
}
.bar{
  height:9px;
  margin:12px 0 10px;
  overflow:hidden;
  border-radius:999px;
  background:rgba(255,255,255,.075);
}
.bar i{
  display:block;
  width:0;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--blue),var(--gold),var(--gold-light));
  box-shadow:0 0 18px rgba(232,200,111,.35);
  transition:width .5s cubic-bezier(.2,.8,.2,1);
}
@keyframes runningPulse{
  from{box-shadow:0 18px 48px rgba(0,0,0,.22),0 0 0 rgba(61,134,216,0),inset 0 0 0 rgba(232,200,111,0)}
  to{box-shadow:0 24px 64px rgba(0,0,0,.24),0 0 34px rgba(61,134,216,.34),0 0 28px rgba(232,200,111,.16),inset 0 0 26px rgba(117,183,255,.12)}
}
@keyframes successRing{
  from{opacity:.78;transform:scale(.96)}
  to{opacity:0;transform:scale(1.18)}
}
@keyframes errorPulse{
  to{box-shadow:0 20px 58px rgba(0,0,0,.24),0 0 30px rgba(255,95,134,.42)}
}
@keyframes flow{to{left:100%}}
@keyframes summaryRise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="screen">
  <div class="hud">
    <header class="top">
      <div class="brand">SOURCEFLOW OS<small>BRAND TOPOLOGY</small></div>
      <div class="title"><h1>源流决策台</h1><span>品牌金蓝拓扑改版</span></div>
      <div class="clock" id="clock"></div>
    </header>

    <main class="main">
      <aside class="panel">
        <h2>任务控制台</h2>
        <div class="console">
          <textarea id="q">评估多AI协同决策工作台的最小验证路径。</textarea>
          <button class="btn" id="start">开始分析</button>
        </div>
        <div class="metric"><span>组织节点</span><b>11</b></div>
        <div class="metric"><span>并行部门</span><b>9</b></div>
        <div class="metric"><span>当前阶段</span><b id="stage">待命</b></div>
      </aside>

      <section class="panel topology" id="topology">
        <div class="line gold-line l1"></div>
        <div class="line gold-line l2"></div>
        <div class="line blue-particle l3"></div>
        <div class="line gold-line l4"></div>
        <div class="line blue-particle l5"></div>
      </section>

      <aside class="panel">
        <h2>协同日志</h2>
        <div class="feed" id="feed"><p>[00:00:00] 系统待命，等待总裁下达任务。</p></div>
      </aside>
    </main>

    <footer class="bottom">
      <section class="panel">
        <h2>拆解进度</h2>
        <div class="summary">需求识别<div class="bar"><i id="p1"></i></div>角色分发<div class="bar"><i id="p2"></i></div></div>
      </section>
      <section class="panel">
        <h2>执行总裁汇总</h2>
        <div class="summary" id="summary">分析完成后生成跨部门简报。</div>
      </section>
      <section class="panel">
        <h2>异常与提醒</h2>
        <div class="summary" id="alerts">暂无异常。</div>
      </section>
    </footer>
  </div>
</div>

<script>
const roles=["总裁","执行总裁","战略部","市场部","产品部","技术部","财务部","风险部","运营部","法务部","自定义部"];
const pos=["president","ceo","dept n0","dept n1","dept n2","dept n3","dept n4","dept n5","dept n6","dept n7","dept n8"];
const topo=document.getElementById("topology");

roles.forEach((role,index)=>{
  const node=document.createElement("div");
  node.className="node idle "+pos[index];
  node.dataset.index=index;
  node.innerHTML=`<b>${role}</b><span>${index<2?"指挥层":"并行分析节点"}</span>`;
  topo.appendChild(node);
});

function log(text){
  feed.innerHTML=`<p>[${new Date().toLocaleTimeString()}] ${text}</p>`+feed.innerHTML;
}

function setNodes(status){
  document.querySelectorAll(".node").forEach(node=>{
    node.classList.remove("idle","running","done","error");
    node.classList.add(status);
  });
}

function setNode(index,status){
  const node=document.querySelector(`[data-index="${index}"]`);
  node.className="node "+status+" "+pos[index];
}

start.onclick=()=>{
  setNodes("idle");
  summary.textContent="执行中：等待各部门回传。";
  summary.classList.remove("show");
  alerts.textContent="暂无异常。";
  stage.textContent="拆解";
  p1.style.width="0";
  p2.style.width="0";
  log("总裁任务已接收，执行总裁开始拆解。");
  setNode(1,"running");

  setTimeout(()=>{
    p1.style.width="100%";
    stage.textContent="分发";
    log("任务拆解完成，9 个部门进入并行执行。");
    setNode(1,"done");

    for(let index=2;index<11;index++){
      setTimeout(()=>{
        setNode(index,"running");
        log(roles[index]+" 正在回传分析数据。");
        setTimeout(()=>{
          setNode(index,"done");
          log(roles[index]+" 已完成。");
          if(index===10){
            p2.style.width="100%";
            stage.textContent="汇总";
            summary.textContent="汇总结论：建议以自用验证优先，重点监控 API Key 门槛、连续使用频率、单次决策耗时和最终输出质量。";
            summary.classList.add("show");
            alerts.textContent="提醒：若 30 天内无法形成高频使用，应停止商业化投入。";
            stage.textContent="完成";
          }
        },760);
      },(index-2)*260);
    }
  },1300);
};

setInterval(()=>{clock.textContent=new Date().toLocaleString();},1000);
clock.textContent=new Date().toLocaleString();
</script>
</body>
</html>
