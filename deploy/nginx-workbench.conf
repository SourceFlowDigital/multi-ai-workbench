# ═══════════════════════════════════════════
# 维护对象：多AI协同决策工作台（端口 8002）
# 域名：workbench.sourceflower.com
# 维护方：宁夏源流数字服务有限公司
# 创建日期：2026-06-20
# 鉴权：Nginx Basic Auth（不对外公开）
# ═══════════════════════════════════════════

server {
    listen 80;
    server_name workbench.sourceflower.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name workbench.sourceflower.com;

    ssl_certificate     /etc/letsencrypt/live/workbench.sourceflower.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workbench.sourceflower.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ═══ 全局 Basic Auth（不对外公开）═══
    auth_basic "源流决策台 · 内部工具";
    auth_basic_user_file /etc/nginx/.htpasswd_workbench;

    # 前端静态文件
    root /var/www/workbench/frontend;
    index index.html;

    # API 反向代理 → 8002
    location /api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # 静态文件
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 日志
    access_log /var/log/nginx/workbench.access.log;
    error_log  /var/log/nginx/workbench.error.log;
}
